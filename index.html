<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inventario</title><style>
:root{--c:#16a34a;--bg:#f0fdf4;--ink:#14532d;--muted:#64748b;--line:#bbf7d0}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui;color:var(--ink)}header{background:linear-gradient(120deg,#15803d,var(--c));color:#fff;padding:28px 20px}main{max-width:1100px;margin:auto;padding:20px}.hero{display:flex;justify-content:space-between;align-items:center}.hero h1{margin:0}button{border:0;border-radius:9px;padding:10px 13px;background:var(--c);color:#fff;font-weight:700;cursor:pointer}button.light{background:#dcfce7;color:#166534}button.danger{background:#fee2e2;color:#991b1b}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.metric,.panel{background:#fff;border:1px solid var(--line);border-radius:15px;padding:16px;box-shadow:0 3px 12px #15803d0d}.metric b{display:block;font-size:27px;margin-top:5px}.muted{color:var(--muted)}.layout{display:grid;grid-template-columns:1fr 330px;gap:18px;margin-top:18px}@media(max-width:800px){.layout{grid-template-columns:1fr}}input,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;font:inherit}.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}table{width:100%;border-collapse:collapse;background:#fff}th,td{text-align:left;padding:11px;border-bottom:1px solid var(--line)}.low{color:#a16207;font-weight:700}.out{color:#dc2626;font-weight:700}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.formgrid>*:last-child{grid-column:1/-1}.hidden{display:none}
</style></head><body><header><main><div class="hero"><div><h1>📊 Inventario</h1><p>Controlá stock, entradas y salidas.</p></div><button class="light" onclick="toggleForm()">➕ Producto</button></div></main></header><main><section class="cards"><div class="metric">📦 Productos totales<b id="all">0</b></div><div class="metric">🟢 Disponibles<b id="available">0</b></div><div class="metric">🟡 Poco stock<b id="low">0</b></div><div class="metric">🔴 Agotados<b id="out">0</b></div><div class="metric">💰 Valor inventario<b id="value">$0</b></div></section><section id="form" class="panel hidden" style="margin-top:18px"><h2>Nuevo producto</h2><form onsubmit="add(event)" class="formgrid"><input id="pn" required placeholder="Producto"><input id="pc" required placeholder="Categoría"><input id="pp" required type="number" min="0" placeholder="Precio"><input id="ps" required type="number" min="0" placeholder="Stock"><button>Guardar producto</button></form></section><div class="layout"><section class="panel"><div class="row"><h2>Productos</h2><input id="search" style="max-width:220px" oninput="render()" placeholder="Buscar"></div><div style="overflow:auto"><table><thead><tr><th>Producto</th><th>Categoría</th><th>Precio</th><th>Stock</th><th>Acciones</th></tr></thead><tbody id="table"></tbody></table></div></section><aside class="panel"><h2>Registrar movimiento</h2><select id="moveProduct"></select><br><br><select id="moveType"><option value="in">Entrada</option><option value="out">Salida</option></select><br><br><input id="moveQty" type="number" min="1" placeholder="Cantidad"><br><br><button onclick="move()">Guardar movimiento</button><h3>Últimos movimientos</h3><div id="movements"></div></aside></div></main><script>
const key='inventory';let items=JSON.parse(localStorage.getItem(key)||'null')||[{id:1,n:'Harina',c:'Insumos',p:1200,s:25},{id:2,n:'Café',c:'Bebidas',p:4500,s:8},{id:3,n:'Vasos',c:'Descartables',p:80,s:0},{id:4,n:'Pan',c:'Insumos',p:600,s:45}],moves=JSON.parse(localStorage.getItem('movements')||'[]');const $=id=>document.getElementById(id),money=n=>'$'+n.toLocaleString('es-AR');function save(){localStorage.setItem(key,JSON.stringify(items));localStorage.setItem('movements',JSON.stringify(moves))}function render(){let q=$('search').value.toLowerCase();$('table').innerHTML=items.filter(x=>x.n.toLowerCase().includes(q)||x.c.toLowerCase().includes(q)).map(x=>`<tr><td>${x.n}</td><td>${x.c}</td><td>${money(x.p)}</td><td class="${x.s===0?'out':x.s<=10?'low':''}">${x.s}</td><td><button class="light" onclick="edit(${x.id})">Editar</button> <button class="danger" onclick="removeItem(${x.id})">Borrar</button></td></tr>`).join('')||'<tr><td colspan="5">No hay productos.</td></tr>';$('moveProduct').innerHTML=items.map(x=>`<option value="${x.id}">${x.n} (${x.s})</option>`).join('');$('all').textContent=items.length;$('available').textContent=items.filter(x=>x.s>0).length;$('low').textContent=items.filter(x=>x.s>0&&x.s<=10).length;$('out').textContent=items.filter(x=>x.s===0).length;$('value').textContent=money(items.reduce((a,x)=>a+x.p*x.s,0));$('movements').innerHTML=moves.slice(-8).reverse().map(m=>`<div class="row"><span>${m.type==='in'?'📈':'📉'} ${m.name}</span><b>${m.type==='in'?'+':'−'}${m.qty}</b></div>`).join('')||'<p class="muted">Sin movimientos.</p>'}function toggleForm(){$('form').classList.toggle('hidden')}function add(e){e.preventDefault();items.push({id:Date.now(),n:$('pn').value,c:$('pc').value,p:+$('pp').value,s:+$('ps').value});save();e.target.reset();render()}function edit(id){let x=items.find(a=>a.id==id),v=prompt('Nuevo stock para '+x.n,x.s);if(v!==null){x.s=Math.max(0,+v);save();render()}}function removeItem(id){if(confirm('¿Eliminar producto?')){items=items.filter(x=>x.id!=id);save();render()}}function move(){let x=items.find(a=>a.id==$('moveProduct').value),qty=+$('moveQty').value,type=$('moveType').value;if(!x||!qty)return alert('Elegí producto y cantidad.');if(type==='out'&&qty>x.s)return alert('No hay stock suficiente.');x.s+=type==='in'?qty:-qty;moves.push({name:x.n,qty,type,date:new Date().toLocaleString('es-AR')});$('moveQty').value='';save();render()}render();
</script></body></html>
